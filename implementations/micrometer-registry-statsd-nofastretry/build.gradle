plugins {
    id 'com.gradleup.shadow' version '8.3.6'
    id ("org.danilopianini.publish-on-central") version "8.0.7"
}

dependencies {
    implementation(group: 'io.micrometer', name: 'micrometer-core', version: '1.15.0')

    implementation platform(libs.reactorBom)
    implementation platform(libs.nettyBom)

    implementation 'io.projectreactor:reactor-core'
    implementation('io.projectreactor.netty:reactor-netty-core') {
        // We do not use HTTP modules; exclude to avoid false positive CVE reports
        exclude module: 'netty-codec-http'
    }
    // We need to make sure netty dns resolution works on all macs
    implementation(group: 'io.netty', name: 'netty-resolver-dns-native-macos', classifier: 'osx-x86_64')
    implementation(group: 'io.netty', name: 'netty-resolver-dns-native-macos', classifier: 'osx-aarch_64')
    implementation(group: 'io.netty', name: 'netty-transport-native-epoll', classifier: 'linux-aarch_64')
    implementation(group: 'io.netty', name: 'netty-transport-native-epoll', classifier: 'linux-x86_64')

    testImplementation project(':micrometer-test')
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation libs.logback12
    testImplementation libs.awaitility
    // for running tests with UDS on OSX
    testImplementation(group: 'io.netty', name: 'netty-transport-native-kqueue', classifier: 'osx-x86_64')
    testImplementation(group: 'io.netty', name: 'netty-transport-native-kqueue', classifier: 'osx-aarch_64')
}

shadowJar {
    configurations = [project.configurations.compileClasspath]
    archiveClassifier.set('')
    dependencies {
        include(dependency('io.projectreactor:'))
        include(dependency('io.projectreactor.netty:'))
        include(dependency('org.reactivestreams:reactive-streams'))
        include(dependency('io.netty:'))
        // see gh-5953
        exclude("META-INF/maven/**")
        exclude("META-INF/io.netty.versions.properties")
    }
    relocate 'reactor', 'io.micrometer.shaded.reactor'
    relocate 'org.reactivestreams', 'io.micrometer.shaded.org.reactorstreams'
    relocate 'io.netty', 'io.micrometer.shaded.io.netty'
    relocate 'META-INF/native/libnetty', 'META-INF/native/libio_micrometer_shaded_netty'
    metaInf {
        from "$rootDir/LICENSE"
        from "$rootDir/NOTICE"
    }
    mergeServiceFiles()
}

publishOnCentral {
    repoOwner.set("arthurosncf") // Used to populate the default value for projectUrl and scmConnection
    projectDescription.set("Micrometer Statsd module Fork with fix to address Kubernetes autoscaled UDP servers")
    // The following values are the default, if they are ok with you, just omit them
    projectLongName.set(project.name)
    licenseName.set("Apache License, Version 2.0")
    licenseUrl.set("http://www.apache.org/licenses/LICENSE-2.0")
    projectUrl.set("https://github.com/${repoOwner.get()}/${project.name}")
    scmConnection.set("scm:git:https://github.com/${repoOwner.get()}/${project.name}")

    /*
     * The plugin is pre-configured to fetch credentials for Maven Central from the context in the following order:
     * 1. Environment variables MAVEN_CENTRAL_USERNAME and MAVEN_CENTRAL_PASSWORD
     * 2. Project properties mavenCentralUsername and mavenCentralPassword
     * 3. Project properties sonatypeUsername and sonatypePassword
     * 4. Project properties ossrhUsername and ossrhPassword
     *
     * They can be further customized through values or providers:
     */
    mavenCentral.user.set("-")
    mavenCentral.password.set(provider { "-"})

    /*
     * The publications can be sent to other destinations, e.g. GitHub
     * The task name would be 'publishAllPublicationsToGitHubRepository'
     */
//    repository("https://maven.pkg.github.com/OWNER/REPOSITORY", "GitHub") {
//        user.set(System.getenv("GITHUB_USERNAME"))
//        password.set(System.getenv("GITHUB_TOKEN"))
//    }

    /*
     * Here is an example of a repository with a custom Nexus instance
     */
//    repository("https://some/valid/repo/with/nexus", "MyNexus") {
//        user.set(mavenCentral.user) // mavenCentral is accessible for
//        password.set(System.getenv("GITHUB_TOKEN"))
//        nexusUrl = "https://some/valid/nexus/instance"
//        // nexusTimeOut and nexusConnectionTimeOut can be configured, too.
//    }

    /*
     * A simplified handler is available for publishing on the Snapshots repository of Maven Central
     */
    if (project.version.toString().endsWith("-SNAPSHOT")) { // Avoid stable versions being pushed there...
        mavenCentralSnapshotsRepository() // Imports user and password from the configuration for Maven Central
        // mavenCentralSnapshotsRepository() {
        //     ...but they can be customized as per any other repository
        // }
    }
}

// The Nebula Publishing plugin automatically configures the publication of the shadow jar but
// shadow dependencies are added to the POM as runtime so we manually clean up the POM.
publishing {
    publications {
        withType(MavenPublication) {
            pom.withXml {
                asNode()
                    .dependencies
                    .dependency
                    .findAll { ['reactor-core', 'reactor-netty-core', 'netty-resolver-dns-native-macos', 'netty-transport-native-epoll'].contains(it.artifactId.text()) }
                    .each { it.parent().remove(it) }
            }
            pom {
                developers {
                    developer {
                        name.set("Arthur Filliot")
                        email.set("arthurosncf@gmail.com")
                        url.set("https://github.com/arthurosncf/")
                    }
                }
            }
        }
    }
}
signing {
    useInMemoryPgpKeys("-", "-")
}
